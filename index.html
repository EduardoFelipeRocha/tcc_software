<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GuiaConcursos — encontre concursos públicos verificados e transforme editais em planos de estudo claros."
    />
    <meta name="theme-color" content="#f4f6f2" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('guiaconcursos-theme')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#091215' : '#f4f6f2',
          )
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>GuiaConcursos | Concursos e planos de estudo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
