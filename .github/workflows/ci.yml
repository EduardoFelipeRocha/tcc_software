name: CI - GuiaConcursos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar Lint
        run: npm run lint

      - name: Rodar Testes Unitários
        run: npm run test

      - name: Gerar Build de Produção
        run: npm run build

      - name: Instalar navegador do Playwright e rodar E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e